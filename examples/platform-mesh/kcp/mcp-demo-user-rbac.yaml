# Grants the demo user admin in a workspace. The front-proxy authenticates
# OIDC tokens as oidc:<email>, so the subject carries the prefix.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-demo-user-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc:alice@example.com

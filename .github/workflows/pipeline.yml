name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# The virtual workspace images are built and published by the upstream
# kcp-dev/contrib-virtual-workspaces repository; this pipeline only packages
# them as one OCM component, versioned from this repository.
env:
  ACCESS_VW_IMAGE: ghcr.io/kcp-dev/contrib-virtual-workspaces/access-vw:0.1.0
  MCP_VW_IMAGE: ghcr.io/kcp-dev/contrib-virtual-workspaces/mcp-vw:0.1.0

jobs:
  # Reusable workflow inputs cannot read env, so expose the image pins as
  # job outputs.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      access-vw-image: ${{ steps.pins.outputs.access-vw-image }}
      mcp-vw-image: ${{ steps.pins.outputs.mcp-vw-image }}
    steps:
      - id: pins
        run: |
          echo "access-vw-image=$ACCESS_VW_IMAGE" >> "$GITHUB_OUTPUT"
          echo "mcp-vw-image=$MCP_VW_IMAGE" >> "$GITHUB_OUTPUT"

  create-version:
    uses: platform-mesh/.github/.github/workflows/job-create-version.yml@main
    secrets: inherit

  sbom:
    needs: config
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@main
    with:
      imageReference: ${{ needs.config.outputs.access-vw-image }}

  # job-sbom's artifact name is fixed, so the second image's SBOMs are
  # generated here and attached through image-ocm's extraResourcesArtifact.
  sbom-mcp-vw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.MCP_VW_IMAGE }}
          format: cyclonedx-json
          output-file: sbom-mcp-vw-cyclonedx.json
          github-token: ${{ github.token }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.MCP_VW_IMAGE }}
          format: spdx-json
          output-file: sbom-mcp-vw-spdx.json
          github-token: ${{ github.token }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-mcp-vw
          path: |
            sbom-mcp-vw-cyclonedx.json
            sbom-mcp-vw-spdx.json
          retention-days: 1

  image-ocm:
    needs: [config, create-version, sbom, sbom-mcp-vw]
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@main
    secrets: inherit
    with:
      componentName: github.com/platform-mesh/images/mcp-integration
      imageReference: ${{ needs.config.outputs.access-vw-image }}
      appVersion: ${{ needs.create-version.outputs.version }}
      repoName: mcp-integration
      commit: ${{ github.sha }}
      extraResourcesArtifact: sbom-mcp-vw
      extraResources: |
        - name: mcp-vw-image
          type: ociImage
          relation: external
          version: "{{ .APP_VERSION }}"
          access:
            type: ociArtifact
            imageReference: ${{ needs.config.outputs.mcp-vw-image }}
        - name: mcp-vw-sbom-cyclonedx
          type: sbom
          input:
            type: file
            path: sbom-mcp-vw-cyclonedx.json
            mediaType: application/vnd.cyclonedx+json
        - name: mcp-vw-sbom-spdx
          type: sbom
          input:
            type: file
            path: sbom-mcp-vw-spdx.json
            mediaType: application/spdx+json
